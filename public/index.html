<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>并肩排雷 · 在线扫雷</title><link rel="stylesheet" href="/style.css?v=20260820-4"></head><body><main><header><div class="brand"><span class="logo">✦</span><div><b>并肩排雷</b><small>CO-OP MINESWEEPER</small></div></div><span class="online">● 实时联机</span></header><section id="lobby" class="lobby lobby-v2"><div class="create-zone"><p class="eyebrow">一起清空雷区</p><h1>拆弹不孤单，<br><em>默契才是外挂。</em></h1><p class="intro">创建有密码或无密码房间，也可以从大厅直接加入正在等待的队伍。</p><div class="setup-grid"><label>你的昵称<input id="name" maxlength="16" placeholder="比如：扫雷队长"></label><label>棋盘模式<select id="mode"><option value="classic">经典 · 30×16 · 99 雷</option><option value="advanced">进阶 · 50×30 · 225 雷</option><option value="huge" selected>超大 · 100×50 · 750 雷</option></select></label><label>创建密码（可选）<input id="createPassword" maxlength="64" type="password" placeholder="留空则无需密码"></label></div><button id="create" class="primary-wide">创建新房间</button><div class="quick-join"><input id="roomCode" maxlength="6" placeholder="房间号"><input id="joinPassword" maxlength="64" type="password" placeholder="房间密码（如有）"><button id="join">加入房间</button></div></div><aside class="room-hall"><div class="hall-head"><div><p class="eyebrow">游戏大厅</p><h2>公开房间列表</h2></div><button id="refreshRooms" class="ghost">刷新</button></div><div id="roomList" class="room-list"><p class="empty-room">正在加载房间…</p></div><p class="hall-note">同一 IP 只能处于一个房间；加入新房间会自动退出旧房间。</p></aside></section><section id="game" hidden><div class="gamebar"><div><p class="eyebrow">房间 <span id="code"></span> · <span id="modeName"></span></p><h2 id="status">等待队友</h2></div><div class="stats"><span>💣 <b id="left">750</b></span><span>⏱ <b id="timer">00:00</b></span><button id="copy">复制邀请链接</button><button id="exitRoom" class="danger-soft">退出房间</button><button id="closeRoom" class="danger" hidden>关闭房间</button></div></div><div class="layout"><div class="board-wrap"><div id="board" class="board"></div><p id="boardTip" class="tip"></p></div><aside class="panel"><section class="team"><h3>排雷小队</h3><div id="players"></div><p class="muted">最近动态</p><p id="activity">房间已创建</p><button id="start">开始游戏</button><button id="restart" hidden>再来一局</button></section><section class="chat"><div class="chat-title"><h3>房间聊天</h3><span>实时</span></div><div id="messages" class="messages"><p class="chat-empty">还没有消息</p></div><form id="chatForm"><input id="chatInput" maxlength="200" autocomplete="off" placeholder="输入消息…"><button>发送</button></form></section></aside></div></section></main><div id="toast"></div><script src="/app.js?v=20260820-4"></script></body></html>
