<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>并肩排雷 · 在线扫雷</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand"><span class="logo">✦</span><div><b>并肩排雷</b><small>CO-OP MINESWEEPER</small></div></div><span class="online">● 实时联机</span></header><section id="lobby" class="lobby"><div><p class="eyebrow">一起清空雷区</p><h1>拆弹不孤单，<br><em>默契才是外挂。</em></h1><p class="intro">创建房间，把链接发给朋友。你们看到同一块棋盘，每一步都会实时同步。</p><label>你的昵称<input id="name" maxlength="16" placeholder="比如：扫雷队长"></label><div class="actions"><button id="create">创建新房间</button><div class="join"><input id="roomCode" maxlength="6" placeholder="输入房间号"><button id="join">加入</button></div></div></div><aside><div class="mini">🚩 <b>协作模式</b><span>共同开格与插旗</span></div><div class="mini">⚡ <b>即时同步</b><span>无需刷新页面</span></div><div class="mini">🔗 <b>一键邀请</b><span>分享链接即可加入</span></div></aside></section><section id="game" hidden><div class="gamebar"><div><p class="eyebrow">房间 <span id="code"></span></p><h2 id="status">等待队友</h2></div><div class="stats"><span>💣 <b id="left">750</b></span><span>⏱ <b id="timer">00:00</b></span><button id="copy">复制邀请链接</button></div></div><div class="layout"><div class="board-wrap"><div id="board" class="board"></div><p class="tip">100 × 50 雷区 · 左键开格 · 右键插旗 · 滚动查看</p></div><aside class="panel"><h3>排雷小队</h3><div id="players"></div><hr><p class="muted">最近动态</p><p id="activity">房间已创建</p><button id="start">开始游戏</button><button id="restart" hidden>再来一局</button></aside></div></section></main><div id="toast"></div><script src="/app.js"></script></body></html>
